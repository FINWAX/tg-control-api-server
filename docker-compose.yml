services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tgapi
      POSTGRES_PASSWORD: tgapi
      POSTGRES_DB: tgapi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tgapi"]
      interval: 3s
      timeout: 3s
      retries: 15

  gateway:
    build: .
    image: tg-control-api-server:local
    command: ["./gateway"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://tgapi:tgapi@postgres:5432/tgapi?sslmode=disable
      API_TOKEN: ${API_TOKEN}
      LISTEN_ADDR: ":8080"
    ports:
      - "8080:8080"

  worker:
    build: .
    image: tg-control-api-server:local
    command: ["./worker"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://tgapi:tgapi@postgres:5432/tgapi?sslmode=disable
      MASTER_KEY: ${MASTER_KEY}
      DATA_DIR: /data
      LISTEN_ADDR: ":8080"
      WORKER_CAPACITY: "200"
    volumes:
      - tdlibdata:/data
    stop_grace_period: 30s
    deploy:
      replicas: 2

  # Optional management console: Next.js static export served by Caddy, which
  # also reverse-proxies /v1 and /healthz to the gateway (single origin, no
  # CORS). Enable with `docker compose --profile ui up -d`.
  ui:
    build: ./ui
    image: tg-control-api-server-ui:local
    restart: unless-stopped
    depends_on:
      - gateway
    environment:
      GATEWAY_UPSTREAM: gateway:8080
    ports:
      - "3080:80"
    profiles: ["ui"]

volumes:
  pgdata:
  tdlibdata:
